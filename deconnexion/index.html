<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TabibDZ - Déconnexion</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:Segoe UI,Tahoma,Arial,sans-serif; background:#f4f7f9; color:#0f172a; }
    .box { background:#fff; border:1px solid #dbe4ea; border-radius:14px; padding:22px; width:min(92vw,460px); text-align:center; box-shadow:0 16px 32px rgba(15,23,42,.08); }
    .msg { color:#64748b; margin-top:8px; }
  </style>
</head>
<body>
  <main class="box">
    <h1 style="margin:0;font-size:22px">Déconnexion en cours...</h1>
    <p id="msg" class="msg">Veuillez patienter.</p>
  </main>

  <script>
    async function logoutAndRedirect() {
      const msg = document.getElementById('msg');
      try {
        await fetch('/api/auth/logout/', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Accept': 'application/json' }
        });
      } catch (_) {
      } finally {
        msg.textContent = 'Vous êtes déconnecté. Redirection...';
        window.location.href = '/tabibdz-homepage.html';
      }
    }

    logoutAndRedirect();
  </script>
</body>
</html>
